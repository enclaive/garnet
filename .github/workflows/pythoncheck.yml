name: Python Quality & Security Checks

on:
  workflow_call:

jobs:

  # ── PIP AUDIT — dependency CVEs ───────────────────────
  pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f
        with:
          python-version: '3.11'

      - name: Scan Python dependencies
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r backend/privacy_proxy/requirements.txt \
            --vulnerability-service osv \
            --no-deps

  # ── RUFF — linter ─────────────────────────────────────
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Ruff lint
        run: |
          pip install ruff
          ruff check backend/privacy_proxy/app/ --exit-zero

  # ── MYPY — type check ─────────────────────────────────
  mypy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Mypy type check
        run: |
          pip install mypy
          mypy backend/privacy_proxy/app/ --ignore-missing-imports --no-error-summary || true

  # ── BANDIT — Python SAST ──────────────────────────────
  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Bandit SAST
        run: |
          pip install bandit
          bandit -r backend/privacy_proxy/app/ -ll --exit-zero